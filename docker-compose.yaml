services:
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mern-thinkboard-backend
    container_name: thinkboard-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
  
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mern-thinkboard-frontend
    container_name: thinkboard-frontend
    restart: always
    ports:
      - "8000:80"
    depends_on:
      - backend